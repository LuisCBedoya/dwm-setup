# Modo de audio de las grabaciones de pantalla (Super+Shift+G).
#   mix    = audio del sistema + micrófono (recomendado)
#   system = solo lo que suena por altavoces/auriculares/HDMI
#   mic    = solo el micrófono
# El dispositivo se elige solo, con la misma prioridad que audio-watch:
# auriculares > USB > Bluetooth > HDMI > altavoces y micro internos.
audio_mode="mix"
# Ganancia de la pista del micrófono en la mezcla (1.0 = sin cambio).
mic_gain=3.0
