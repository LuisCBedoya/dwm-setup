# picom - Gruvbox Material
backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "class_g = 'dwm'"
];

corner-radius = 10;
rounded-corners-exclude = [
  "class_g = 'dwm'"
];

blur-background = true;
blur-method = "dual_kawase";
blur-strength = 6;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'dwm'"
];

inactive-opacity = 1.0;
frame-opacity = 1.0;
active-opacity = 1.0;

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;
log-level = "warn";

wintypes:
{
  normal = { shadow = true; };
  dialog = { shadow = true; };
  utility = { shadow = true; };
  tooltip = { fade = true; shadow = true; opacity = 1; focus = true; };
  popup_menu = { opacity = 1; };
  dropdown_menu = { opacity = 1; };
  dock = { shadow = false; };
  dnd = { shadow = true; };
};
