# Mitiga parpadeos/corrupción de Intel en X11.
# Se instala por defecto en equipos Intel.
# enable_psr/enable_dc a 0 evitan apagones momentáneos del monitor externo
# (HDMI) por estados de ahorro de energía del display. enable_sagv=0 evita
# underruns del pipe de display bajo carga en algunos Intel.
options i915 enable_fbc=0 enable_psr=0 enable_dc=0 enable_sagv=0
