# Política de audio Bluetooth de luc-workspace.
#
# Con bluetooth.autoswitch-to-headset-profile activo, WirePlumber cambia
# el perfil A2DP a HFP/HSP solo mientras una aplicación graba del
# micrófono del headset; al terminar vuelve a A2DP automáticamente.
# Sin esto, el micrófono del headset no se activaría al grabar.

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
  bluetooth.use-persistent-storage = true
}
