# display-setup — política de pantallas (se lee en cada sesión).
#
# layout: extend | mirror
#   extend  = cada monitor a la derecha del anterior (por defecto)
#   mirror  = todos muestran lo mismo
layout=extend

# refresh: auto | max | preferred | <Hz>
#   auto      = 120 (o 119.88) si el monitor lo ofrece; si no, 60 (o
#               59.94); si no, la tasa máxima disponible (por defecto)
#   max       = la tasa máxima absoluta (144, 100, 75…)
#   preferred = la tasa preferida del EDID
#   <Hz>      = forzar una tasa concreta (por ejemplo 60)
refresh=auto
